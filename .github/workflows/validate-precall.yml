name: Validate pre-call UI
on:
  push:
    branches:
      - design/simplify-pre-call-screen
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run build
        env:
          NEXT_PUBLIC_BASE_PATH: /VuCall
          NEXT_PUBLIC_ICE_CONFIG_URL: https://vucall.ukhelda.workers.dev/ice-servers
