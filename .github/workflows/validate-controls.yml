name: Validate restored call controls

on:
  push:
    branches: [fix/restore-control-button-position]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build
        env:
          NEXT_PUBLIC_BASE_PATH: /VuCall
          NEXT_PUBLIC_ICE_CONFIG_URL: https://vucall.ukhelda.workers.dev/ice-servers
